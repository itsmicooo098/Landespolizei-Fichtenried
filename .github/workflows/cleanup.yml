name: Restricted retention cleanup (prepared)
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retention-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    # Intentionally disabled pending explicit approval of restricted deletion rights.
    if: github.event.repository.private == false && false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Restore verified project source
        run: |
          cat source.*.b64 | base64 --decode > source.zip
          echo 'cec73ae53667148fbe9605cd220e09d6a5d310acc85cebb874222afe1e531e8b  source.zip' | sha256sum --check
          unzip -o source.zip
      - name: Apply verified update
        run: |
          base64 --decode portal-update.b64 > portal-update.zip
          echo '50a450c66e79237af317b00cfc6b8394d320945037773fc5741ee4737b3dc55f  portal-update.zip' | sha256sum --check
          unzip -o portal-update.zip
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node backend/cleanup.mjs
        env:
          RETENTION_ENABLED: 'false'
          GITHUB_REPOSITORY_VISIBILITY: public
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_NOTIFIER_EMAIL: ${{ secrets.FIREBASE_NOTIFIER_EMAIL }}
          FIREBASE_NOTIFIER_PASSWORD: ${{ secrets.FIREBASE_NOTIFIER_PASSWORD }}
