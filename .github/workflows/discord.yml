name: Discord notifications (free public runner)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discord-notifications
  cancel-in-progress: false
jobs:
  notify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified project source
        run: |
          cat source.*.b64 | base64 --decode > source.zip
          echo 'cec73ae53667148fbe9605cd220e09d6a5d310acc85cebb874222afe1e531e8b  source.zip' | sha256sum --check
          unzip -o source.zip
      - name: Apply verified portal update
        run: |
          base64 --decode portal-update.b64 > portal-update.zip
          actual=$(sha256sum portal-update.zip | cut -d' ' -f1)
          case "$actual" in
            198b54166999ccb07423d0b3b6e8455310b034dd37f64eae34d8717f8b42271f|d1b0225aa2cfd8105228f2bcde43a9d44940deb279e25a048d689a1453b7b30e|6d8bf71f74cf60df8927597836a420ac24af375dca47e96a841ed257adf410b6|01166e603a6e7d9edf7884322b61c89e7447a816562188ad62917d616216786c|069f721ac474d543c397b3139abaaa8e6bda36537fc1d2d31f6345cb61df9e27|30333c856594bc4b834639ed0154a22778d465f47eb0f7e512b8ab3913d38d65|a79b8dde9d1df7c14fd79e63d3ac00856ad6df4ab7350145861c0593dcae8a53|6f3f59c96b0847f85cfe606c4ad2188e7240da3895c12cc4cf8adeed7fef3324|1bcf5c4e141c39df6a3ca3d6000f8f3099d6822ac04d1c8d3291c8d4e282b780|f0b7d50d408d040d2370b211e2cba18e3d950e6ac8add80c1da63b72310b5547|c4785be1e1248f6dd1a5ec53fc2a4dd2620874a08c2ad4dce392fad5bb5b8ff1) ;;
            *) echo "Unrecognized portal update checksum: $actual"; exit 1 ;;
          esac
          unzip -o portal-update.zip
      - name: Apply verified Discord worker patch
        run: |
          base64 --decode discord-access-patch-v2.b64 > discord-access-patch-v2.zip
          echo 'ccd166218cac9cb57e57aa8d5a244369618bcf8a7a0de8602881df86e323d0d9  discord-access-patch-v2.zip' | sha256sum --check
          unzip -o discord-access-patch-v2.zip
      - name: Add safe Discord delivery diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/notify.mjs')
          text = path.read_text()
          patches = [
              ("for(const row of items){", "let sent=0,expired=0;for(const row of items){"),
              ("if(n.submittedAt&&Date.now()-Date.parse(n.submittedAt)>86400000){", "if(n.submittedAt&&Date.now()-Date.parse(n.submittedAt)>86400000){expired++;"),
              ("color:14137189}]})});}", "color:14137189}]})});sent++;}"),
              ("console.log('Notification batch completed.');", "const pending=items.filter(row=>row.document).length;console.log(JSON.stringify({message:'Notification batch completed.',pending,sent,expired,skippedByCategory:Math.max(0,pending-sent-expired)}));"),
          ]
          for old, new in patches:
              if text.count(old) == 1:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Could not apply safe diagnostic patch: {old[:45]}')
          path.write_text(text)
          PY
      - run: node backend/notify.mjs
        env:
          GITHUB_REPOSITORY_VISIBILITY: public
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_NOTIFIER_EMAIL: ${{ secrets.FIREBASE_NOTIFIER_EMAIL }}
          FIREBASE_NOTIFIER_PASSWORD: ${{ secrets.FIREBASE_NOTIFIER_PASSWORD }}
