name: Publish both websites
on:
  push:
    branches: [main]
    paths: ['portal-update.b64', 'discord-visual-fix-v3.b64', 'staff-profiles-patch.b64', 'staff-directory-patch.b64', 'source.*.b64', 'site/**', 'backend/firestore.rules', 'tests/**', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Restore verified project source
        run: |
          cat source.*.b64 | base64 --decode > source.zip
          echo 'cec73ae53667148fbe9605cd220e09d6a5d310acc85cebb874222afe1e531e8b  source.zip' | sha256sum --check
          unzip -o source.zip
      - name: Apply verified portal update
        run: |
          base64 --decode portal-update.b64 > portal-update.zip
          actual=$(sha256sum portal-update.zip | cut -d' ' -f1)
          case "$actual" in
            2e2315725322f6726e17aba8d00fa86ca5f723db87609784e82927b4178702e3|4b08ba3837aa49d9548c7cdadf95bafa88ff06d7b368ee03d3afbd1c1f88dda2|cbdcd92e418766f1a3edcd1718bea2af87cebc0a9f0ae4f937494ab30fd4249d|f9383f7bbae5b9f200a71b11b174e7b2db8b43cd2f36051a21ed242fc3ec437e|4ca615ecef9bc722aa1b41345b28a2cd37236b0691099d57c1f2e7ac5e14ab61|ed45960c38ca520e18fc9e8a3df58972b3aceafd41f57115001a61753dff3414|4b1fdf5d1cc7bfc9b2e25336c497a4e5ddb986059c05abb64ab5892e777af844|38eeaa9a4d191f77754f8139ed0b30e4de1feaa6c4fbfc81e774812d3281b26f|cd1b63d83dd1328d79bfc11d4f26096410d01471e4bb98556c1f7698eeedc0cb|f4c38f71b9ac1860eb116b88d290f3c4f88365b52cdd32f3b859a6d0f9018125|91b733ad1edd5d3e33bf60a41ef7d9b4bd59a81e6678b5d9e9fbf364abea8842|e335b7de980c5166839489aba13777f1a460eca2cbd1deb9ed5412cc8c98ed2d|37b826d777da5c5251f12498d924c641e61869ee6d009731a69aab858ce8a432|bced8494d5f97ba06a283cc6cb2489adc73235c0029284e58ab61fc6b8f7d066|9ff539b3be54a45af8dfdd3f66429482edfd7ca693546a6502f0b2455e794a59|b9816ccf972264d8f4f435a05fa40dfaff39eb81c36c0c667c5836fb2ace5290|d1b0225aa2cfd8105228f2bcde43a9d44940deb279e25a048d689a1453b7b30e|6d8bf71f74cf60df8927597836a420ac24af375dca47e96a841ed257adf410b6|01166e603a6e7d9edf7884322b61c89e7447a816562188ad62917d616216786c|069f721ac474d543c397b3139abaaa8e6bda36537fc1d2d31f6345cb61df9e27|30333c856594bc4b834639ed0154a22778d465f47eb0f7e512b8ab3913d38d65|a79b8dde9d1df7c14fd79e63d3ac00856ad6df4ab7350145861c0593dcae8a53|6f3f59c96b0847f85cfe606c4ad2188e7240da3895c12cc4cf8adeed7fef3324|1bcf5c4e141c39df6a3ca3d6000f8f3099d6822ac04d1c8d3291c8d4e282b780|f0b7d50d408d040d2370b211e2cba18e3d950e6ac8add80c1da63b72310b5547|c4785be1e1248f6dd1a5ec53fc2a4dd2620874a08c2ad4dce392fad5bb5b8ff1|8e76e2c0209278237f507acb897bc77002a4f1d7b52d3ed656c70ec8a1ba46e0) ;;
            *) echo "Unrecognized portal update checksum: $actual"; exit 1 ;;
          esac
          unzip -o portal-update.zip
      - name: Apply verified staff profile patch
        run: |
          base64 --decode staff-profiles-patch.b64 > staff-profiles-patch.zip
          echo '38dcbf932563ffcaa9d2670dac80615b56d8635bc9ff24cc5af96386e23777dd  staff-profiles-patch.zip' | sha256sum --check
          unzip -o staff-profiles-patch.zip
      - name: Apply verified personnel directory update
        run: |
          base64 --decode staff-directory-patch.b64 > staff-directory-patch.zip
          echo '91554df822d8a3b49612d1d7ca512e9a95375518d08aa8d85124705cbd40be0b  staff-directory-patch.zip' | sha256sum --check
          unzip -o staff-directory-patch.zip
      - name: Remove Discord construction blur
        run: |
          base64 --decode discord-visual-fix-v3.b64 > discord-visual-fix-v3.zip
          echo '8a721c13f1416971c5c06dd9e41c7193d3883508021413265cc7065df08a69b8  discord-visual-fix-v3.zip' | sha256sum --check
          unzip -o discord-visual-fix-v3.zip
      - name: Apply one-minute submission cooldown fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rules = Path('backend/firestore.rules')
          lines = rules.read_text().splitlines(keepends=True)
          hits = [i for i, line in enumerate(lines) if "duration.value(60,'s')" in line]
          if len(hits) > 1:
              raise SystemExit(f'Expected at most one cooldown rule, found {len(hits)}')
          if hits:
              del lines[hits[0]]
              rules.write_text(''.join(lines))
          targets = [
              (Path('site/assets/spark.js'), "try{await batch.commit();}catch(e){if(e.code==='permission-denied')throw Error('Einreichung nicht möglich. Pflichtfelder prüfen und zwischen Anträgen mindestens eine Minute warten. Ihre Angaben können Sie weiterhin als Offline-Kopie sichern.');throw e;}", "try{await batch.commit();}catch(e){if(e.code==='permission-denied')throw Error('Einreichung nicht möglich. Bitte Pflichtfelder prüfen oder es erneut versuchen. Ihre Angaben können Sie weiterhin als Offline-Kopie sichern.');throw e;}"),
              (Path('tests/rules.test.mjs'), "test('Second submission within a minute fails',async()=>{await assertFails(submit('citizen','LF-2026-'+'C'.repeat(20)))});", "test('Citizens can submit multiple requests without waiting a minute',async()=>{await assertSucceeds(submit('citizen','LF-2026-'+'C'.repeat(20)))});"),
          ]
          for path, old, new in targets:
              text = path.read_text()
              if text.count(old) == 1:
                  path.write_text(text.replace(old, new, 1))
              elif new not in text:
                  raise SystemExit(f'Could not find expected target in {path}')
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: rm -f package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Restore binary assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          for p in Path('site').rglob('*.b64'):
              p.with_suffix('').write_bytes(base64.b64decode(p.read_text()))
              p.unlink()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

