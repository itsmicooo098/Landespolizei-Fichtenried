name: Publish both websites
on:
  push:
    branches: [main]
    paths: ['portal-update.b64', 'source.*.b64', 'site/**', 'backend/firestore.rules', 'tests/**', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Restore verified project source
        run: |
          cat source.*.b64 | base64 --decode > source.zip
          echo 'cec73ae53667148fbe9605cd220e09d6a5d310acc85cebb874222afe1e531e8b  source.zip' | sha256sum --check
          unzip -o source.zip
      - name: Apply verified portal update
        run: |
          base64 --decode portal-update.b64 > portal-update.zip
          actual=$(sha256sum portal-update.zip | cut -d' ' -f1)
          case "$actual" in
            2e2315725322f6726e17aba8d00fa86ca5f723db87609784e82927b4178702e3|4b08ba3837aa49d9548c7cdadf95bafa88ff06d7b368ee03d3afbd1c1f88dda2|cbdcd92e418766f1a3edcd1718bea2af87cebc0a9f0ae4f937494ab30fd4249d|f9383f7bbae5b9f200a71b11b174e7b2db8b43cd2f36051a21ed242fc3ec437e|4ca615ecef9bc722aa1b41345b28a2cd37236b0691099d57c1f2e7ac5e14ab61|ed45960c38ca520e18fc9e8a3df58972b3aceafd41f57115001a61753dff3414|4b1fdf5d1cc7bfc9b2e25336c497a4e5ddb986059c05abb64ab5892e777af844) ;;
            *) echo "Unrecognized portal update checksum: $actual"; exit 1 ;;
          esac
          unzip -o portal-update.zip
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: rm -f package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Restore binary assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          for p in Path('site').rglob('*.b64'):
              p.with_suffix('').write_bytes(base64.b64decode(p.read_text()))
              p.unlink()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

