name: Publish both websiteson:  push:    branches: [main]    paths: ['portal-update.b64', 'source.*.b64', 'site/**', 'backend/firestore.rules', 'tests/**', 'package.json', '.github/workflows/pages.yml']  workflow_dispatch:permissions:  contents: read  pages: write  id-token: writeconcurrency:  group: pages  cancel-in-progress: truejobs:  deploy:    if: github.event.repository.private == false    runs-on: ubuntu-latest    environment:      name: github-pages      url: ${{ steps.deployment.outputs.page_url }}    steps:      - uses: actions/checkout@v5      - name: Restore verified project source        run: |          cat source.*.b64 | base64 --decode > source.zip          echo 'cec73ae53667148fbe9605cd220e09d6a5d310acc85cebb874222afe1e531e8b  source.zip' | sha256sum --check          unzip -o source.zip      - name: Apply verified portal update        run: |          base64 --decode portal-update.b64 > portal-update.zip          actual="$(sha256sum portal-update.zip | cut -d' ' -f1)"
          case "$actual" in
            8dad224d72db0ee1aff6f74afd7d79a61e280d6cd731d60205b65da7f0e61d88|2e2315725322f6726e17aba8d00fa86ca5f723db87609784e82927b4178702e3) ;;
            *) echo "Unrecognized portal update checksum: $actual"; exit 1 ;;
          esac          unzip -o portal-update.zip      - uses: actions/setup-node@v5        with:          node-version: 22      - uses: actions/setup-java@v5
